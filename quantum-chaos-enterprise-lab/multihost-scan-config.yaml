# QU.I.R.K. scan config for the chaos lab's `multihost` profile (999.110 thin slice).
#
# Run it from INSIDE the prober, which is the only vantage point that can see the
# 10.80.0.0/24 subnet (bridge networks are not routable from a macOS Docker Desktop host):
#
#   PROFILE_ARGS="--profile multihost" ./lab.sh up
#   docker compose --profile multihost exec mh-prober \
#     quirk --config /repo-lab/multihost-scan-config.yaml
#
# `--config` is REQUIRED: without it `quirk` drops into the interactive wizard.
# There is no `--targets` flag and no positional target argument.
#
# Paths are container paths. /out is bind-mounted to ./quirk-output at the repo root, so after
# the scan the DB is readable from the host:
#
#   quirk serve --db-path quirk-output/quirk.db
#
# Derived from the repo-root config.yaml so it inherits every other default; only `targets.cidrs`,
# `output.directory` and `output.db_path` differ.
# quirk-lab-config: true
#
# This file is the repo's chaos-lab working config -- it is NOT the shipped
# default. `quirk/config_template.yaml` is the shipped default; `quirk init`
# copies that file verbatim with no branching (Phase 184.2 D-13). Any
# connector divergence from the template below must be listed in this
# file's own exception list with a reason, or
# tests/test_config_connector_drift.py's D-13 gate fails.
#
# NOTE (999.110 follow-up): the exception list below was inherited verbatim from the
# repo-root config.yaml when this file was derived from it, and so described THAT
# file's divergences rather than this one's. The D-13 gate checks both directions and
# caught both halves: nine real divergences undeclared, and four entries
# (enable_kerberos, kerberos_targets, dnssec_targets, dnssec_resolver) describing drift
# this file does not have. Rewritten from the gate's own output rather than by copying
# again. Every entry below is a divergence this file actually carries.
#
# FORMAT WARNING: `_parse_lab_exceptions()` stops at the FIRST line after the header
# that is not an entry, so the entries must follow `# lab-only connector exceptions:`
# CONTIGUOUSLY. Any prose or blank `#` line inserted between them silently truncates
# the list, and every entry below the break reads as undeclared. Keep commentary here,
# above the header — not inside it.
#
# lab-only connector exceptions:
#   saml_targets: points at THIS profile's mh-saml-idp at 10.80.0.41:8080, not the single-host lab's localhost:8080 IdP (999.110)
#   enable_dnssec: false here, true in the template — this subnet has no bind9 resolver, and a DNSSEC connector aimed at a host that cannot answer produces silence or a misleading finding
#   enable_db: true — mh-db-finance (PostgreSQL) at 10.80.0.30 is a first-class target of this profile; the template ships it false
#   pg_targets: 10.80.0.30, the multihost subnet's PostgreSQL host (template ships none)
#   pg_scanner_user: lab fixture credential for mh-db-finance; the template ships none because there is no default database to scan
#   pg_scanner_password: as above — a throwaway chaos-lab value, not a secret
#   enable_s3: true — mh-storage-archive holds one SSE-S3 and one deliberately UNENCRYPTED bucket so the at-rest contrast is real; the template ships it false
#   aws_endpoint_url: http://10.80.0.50:9000, the profile's MinIO endpoint; the template ships none so the real AWS endpoint is used
#   aws_region: us-east-1, required by the S3 client against MinIO; the template ships none
#   broker_targets: 10.80.0.31, this profile's Redis (mh-cache-session); the template ships none
#   mysql_targets: 10.80.0.111, this profile's MySQL (mh-db-hr); the template ships none
#   mysql_scanner_user: lab fixture credential for mh-db-hr, which seeds no dedicated scanner account
#   mysql_scanner_password: as above — a throwaway chaos-lab value, not a secret
#   enable_kerberos: true — mh-kdc at 10.80.0.42 serves realm QUIRK.LAB; the template ships it false and this file shipped false until 2026-09-17, when the KDC was added to the profile
#   kerberos_targets: 10.80.0.42, this profile's KDC (mh-kdc); the template ships none
#   enable_vault: true — mh-vault at 10.80.0.61 holds transit keys, a PKI root and auth mounts; the template ships it false
#   vault_addr: http://10.80.0.61:8200, this profile's Vault; the template ships none
#   vault_token: dev-mode root token for mh-vault — a throwaway chaos-lab value, not a secret
#   vault_transit_mount: transit, the mount mh-vault-seed populates; the template ships none
#   vault_tls_verify: false — mh-vault runs dev mode over plain HTTP, so certificate verification has nothing to verify
#   jwt_targets: the four mh-jwt-* JWKS base URLs at 10.80.0.90-.93:8000; the template ships none (note enable_jwt itself does NOT diverge — the template already ships it true)
#
# (End of the exception list — nothing may be inserted above this line inside the
# block.)
#
# CORRECTED 2026-09-17: this note previously read "enable_kerberos is deliberately NOT
# listed: it is false here AND false in the template, so it does not diverge." That was
# true until mh-kdc was added to the profile on 2026-09-17; enable_kerberos is now true
# here and still false in the template, so it DOES diverge and is listed above. The note
# is kept rather than deleted because it records the gate's other direction: a declared
# key that stops diverging becomes a STALE entry and fails just as loudly. Ten further
# entries landed in the same change (mysql_*, kerberos_targets, vault_*).
#
# Enumerated from the gate, not by hand: pytest truncates the assertion list, so reading
# the failure output reported ONE undeclared key when there were eleven. Recompute with
#   _divergent_connector_keys(_file_connectors_block(path), _template_connectors_block())
# from tests/test_config_connector_drift.py rather than trusting the printed failure.

# vertical: healthcare

assessment:
  name: "Quantum Crypto Readiness - CLIENT NAME"
  data_classification: "confidential"   # public|internal|confidential|regulated
  report_owner: "CLIENT NAME"
  timezone: "America/New_York"

scan:
  timeout_seconds: 5
  concurrency: 200
  ports_tls: [443,80,389,636,2222,3306,5432,6379,8080,9000,9001]
  include_sni: true

  tls_enum_mode: fast  # off|fast|deep

  fingerprint_timeout_seconds: 2
  fingerprint_concurrency: 200

  tls_timeout_seconds: 5
  tls_concurrency: 150

  ssh_timeout_seconds: 5
  ssh_concurrency: 100

targets:
  fqdns:
  # The ten real hosts as explicit /32s. Deliberately NOT "10.80.0.0/24":
  # a full sweep of the subnet found 254 phantom hosts (10 INFO findings each, 2572 total) and
  # reported the Docker bridge gateway at .1 as a CRITICAL — noise that buries the real topology
  # and makes the Exposure Map unreadable. Verified by running both ways.
  cidrs:
    - "10.80.0.10/32"   # mh-edge-legacy      TLS 1.0/1.1 + weak ciphers
    - "10.80.0.11/32"   # mh-edge-expired     expired certificate
    - "10.80.0.12/32"   # mh-edge-rsa1024     RSA-1024 key (weak)
    - "10.80.0.13/32"   # mh-edge-sha1        SHA-1 signed cert
    - "10.80.0.14/32"   # mh-edge-chainbroken missing intermediate
    - "10.80.0.15/32"   # mh-legacy-intranet  plaintext HTTP only
    - "10.80.0.16/32"   # mh-intranet-wiki        plaintext HTTP
    - "10.80.0.17/32"   # mh-intranet-tickets     plaintext HTTP
    - "10.80.0.18/32"   # mh-intranet-jenkins     plaintext HTTP
    - "10.80.0.19/32"   # mh-intranet-fileshare   plaintext HTTP
    - "10.80.0.20/32"   # mh-app-crownjewel   modern TLS (the crown jewel)
    - "10.80.0.21/32"   # mh-intranet-printsrv    plaintext HTTP
    - "10.80.0.22/32"   # mh-intranet-monitoring  plaintext HTTP
    - "10.80.0.30/32"   # mh-db-finance       Postgres, no TLS
    - "10.80.0.31/32"   # mh-cache-session    Redis, no TLS/auth
    - "10.80.0.40/32"   # mh-identity-dc      LDAP cleartext
    - "10.80.0.41/32"   # mh-saml-idp         SAML IdP
    - "10.80.0.50/32"   # mh-storage-archive  S3 + unencrypted bucket
    - "10.80.0.60/32"   # mh-pki-ca           step-ca
    - "10.80.0.70/32"   # mh-ssh-jump         SSH
    - "10.80.0.101/32"  # mh-vpn-gateway      EXPIRED cert
    - "10.80.0.102/32"  # mh-mail-relay       EXPIRED cert
    - "10.80.0.103/32"  # mh-vendor-portal    EXPIRED cert
    - "10.80.0.104/32"  # mh-backup-console   EXPIRED cert
    - "10.80.0.105/32"  # mh-devtest-api      self-signed
    - "10.80.0.106/32"  # mh-staging-web      self-signed
    - "10.80.0.107/32"  # mh-iot-controller   self-signed
    - "10.80.0.108/32"  # mh-erp-frontend     legacy TLS
    - "10.80.0.109/32"  # mh-hr-portal        legacy TLS
    - "10.80.0.110/32"  # mh-payroll          legacy TLS
    - "10.80.0.111/32"   # mh-db-hr            MySQL, ssl-off
    # Connector-coverage hosts added 2026-09-17.
    - "10.80.0.42/32"    # mh-kdc              Kerberos KDC (QUIRK.LAB)
    - "10.80.0.61/32"    # mh-vault            HashiCorp Vault (dev)
    - "10.80.0.90/32"    # mh-jwt-rs256        JWT RS256
    - "10.80.0.91/32"    # mh-jwt-hs256        JWT HS256
    - "10.80.0.92/32"    # mh-jwt-rsa1024      JWT RSA-1024
    - "10.80.0.93/32"    # mh-jwt-algnone      JWT alg=none
    - "10.80.0.120/32"   # mh-postfix          SMTP / SMTPS / submission
    - "10.80.0.121/32"   # mh-dovecot          IMAP / POP3 ± TLS  # mh-db-hr            MySQL plaintext
  include_ips: []
  exclude_ips: []

connectors:
  enable_aws: false
  enable_azure: false

  # Connector targets below are rewritten for the multihost subnet. The repo-root config.yaml
  # points them all at 127.0.0.1/localhost, which is correct for the single-host lab and WRONG
  # here — a connector aimed at loopback silently finds nothing rather than erroring.

  # Kerberos: DISABLED. This profile has no KDC (mh-identity-dc is LDAP-only, port 389/636).
  # Left off rather than aimed at a host that cannot answer — a connector pointed at the wrong
  # service produces either silence or a misleading finding, and neither belongs in a demo.
  # Kerberos: mh-kdc at 10.80.0.42, realm QUIRK.LAB.
  # Enabled 2026-09-17. Previously false with the note "no KDC on this subnet" — there is
  # one now. NOTE this connector needs `quirk-scanner[identity]` for impacket, which `[all]`
  # deliberately excludes (pyOpenSSL/cryptography chain). The prober image installs `.[all]`
  # and therefore CANNOT scan this host; run from a scanner that has [identity] installed, or
  # accept a missing-extra advisory for this one connector.
  enable_kerberos: true
  kerberos_targets:
    - "10.80.0.42"

  # DNSSEC: DISABLED for the same reason — no bind9 resolver on this subnet.
  enable_dnssec: false

  # SAML IdP: mh-saml-idp at 10.80.0.41.
  enable_saml: true
  saml_targets:
    - "http://10.80.0.41:8080/simplesaml/saml2/idp/metadata.php"

  # Broker/cache: mh-cache-session (Redis, no TLS, no auth) at 10.80.0.31.
  # Per Phase 190/TRIAGE-06 the entry may be a bare host — the scanner's per-family default
  # ports still apply, and an explicit port would be ADDED to that list, never replace it.
  enable_broker: true
  broker_targets:
    - "10.80.0.31"

  # Object storage: mh-storage-archive at 10.80.0.50, holding one SSE-S3 bucket and one
  # deliberately UNENCRYPTED bucket so the at-rest contrast is real rather than asserted.
  #
  # `aws_endpoint_url` is REQUIRED and is what was missing on the first pass. Without it the
  # connector never talks to MinIO, no endpoint is classified `S3`, and — the part that actually
  # matters for the score — `_dar_assessed()` reads protocol_counts for
  # POSTGRESQL/MYSQL/RDS/S3/AZURE_BLOB/KUBERNETES/VAULT and returns False, so the whole
  # Data at Rest domain is dropped from the rollup as UNASSESSED rather than scoring badly.
  # Credentials come from AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY on the prober (minioadmin).
  enable_s3: true
  aws_region: us-east-1
  aws_endpoint_url: http://10.80.0.50:9000

  # Database: mh-db-finance at 10.80.0.30 (Postgres, no TLS).
  # `pg_targets` + scanner credentials are likewise required — `enable_db: true` alone probes
  # nothing, which is why the host returned INFO only and POSTGRESQL never reached
  # protocol_counts.
  enable_db: true
  pg_targets:
    - "10.80.0.30"
  pg_scanner_user: finance
  pg_scanner_password: finance

  # mh-db-hr at 10.80.0.111 (mysql:8.0.40, MYSQL_ROOT_PASSWORD=hr, MYSQL_DATABASE=hr).
  # Added 2026-09-17: the host was already in targets.cidrs and already had a container in the
  # multihost profile, but `mysql_targets` was absent, so `enable_db: true` probed Postgres only
  # and MySQL never reached protocol_counts — the same "enable_* alone probes nothing" trap the
  # pg_targets comment above records, pointed at the other engine. Verified against the live
  # container before being written here: scan_mysql_targets(["10.80.0.111"], user="root",
  # password="hr") returns one endpoint, protocol=MYSQL, service_detail="MySQL/ssl-off",
  # severity=HIGH.
  #
  # `root` is used because this container seeds no dedicated scanner account, unlike the
  # single-host `database` profile's mysql-ssl-off (quirk_scanner/quirk_scanner). A read-only
  # scanner grant would be better practice; it needs an init script on the container, which is a
  # lab change rather than a config one.
  mysql_targets:
    - "10.80.0.111"
  mysql_scanner_user: root
  mysql_scanner_password: hr

  # Vault: mh-vault at 10.80.0.61 (dev mode, root token), seeded by mh-vault-seed with the
  # same transit keys / PKI root / auth mounts the single-host `vault` profile uses.
  # Added 2026-09-17. Expected: exportable transit key MEDIUM, RSA<4096 PKI root HIGH,
  # dev-token auth HIGH, userpass auth MEDIUM. Needs quirk-scanner[cloud] for hvac.
  enable_vault: true
  vault_addr: "http://10.80.0.61:8200"
  vault_token: "root"
  vault_transit_mount: "transit"
  vault_tls_verify: false

  # JWT/API endpoints: one per algorithm defect, mirroring the `jwt` profile's four
  # services. Added 2026-09-17.
  #
  # These are BASE URLs, not token URLs. The connector probes JWKS paths
  # (/.well-known/jwks.json, /oauth/jwks, /.well-known/openid-configuration) by
  # concatenating them onto each target, so a target ending in /token makes it request
  # /token/.well-known/jwks.json and find nothing. Measured against the live services:
  # "http://10.80.0.90:8000/token" -> 0 endpoints, "http://10.80.0.90:8000" -> 1.
  # docs/chaos-lab.md documented the /token form for the single-host profile; corrected
  # in the same change.
  enable_jwt: true
  jwt_targets:
    - "http://10.80.0.90:8000"   # RS256    — baseline
    - "http://10.80.0.91:8000"   # HS256    — symmetric
    - "http://10.80.0.92:8000"   # RSA-1024 — undersized key
    - "http://10.80.0.93:8000"   # alg=none — unsigned

  # Email: mh-postfix (10.80.0.120) and mh-dovecot (10.80.0.121). Added 2026-09-17.
  # The email scanner takes NO target fields — it derives hosts from the TLS-scanned
  # target list, which is why both addresses are added to targets.cidrs above. It then
  # probes its own fixed 7-port table (25/465/587/143/993/110/995) against each.
  # Needs sslyze; the prober image lacks it until the [all] extras rebuild lands
  # (sslyze became a core dependency 2026-09-17).
  enable_email: true

output:
  directory: "/out"
  db_path: "/out/quirk.db"   # canonical — matches dashboard/doctor/console resolution (Phase 74 D-05)

intelligence:
  intelligence_version: "3.9.0"
  profile: "balanced"        # lenient|balanced|strict
  calibration_overrides: {}

# Phase 121: Server-policy flag for internal target scanning.
# Set to false on machines that also scan untrusted client environments.
security:
  allow_internal_targets: true

# Console behavior settings (Phase 114 AUTOMERGE-02)
console:
  auto_merge:
    enabled: true                        # default: ON (D-07); set false to require manual `quirk sensor merge`
    trigger_condition: all-sensors-in    # "all-sensors-in" | "cadence-window" (D-08)
    # cadence_window_minutes: 1440       # used only when trigger_condition: cadence-window
    #                                    # defaults to per-sensor expected_cadence_minutes (D-09)
