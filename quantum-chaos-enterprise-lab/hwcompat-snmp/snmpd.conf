# Net-SNMP daemon configuration for hwcompat-snmp chaos lab container
# Simulates a Cisco IOS device for QUIRK SNMP-based hardware fingerprinting tests.
# Profile: hwcompat — Port 20223 UDP

# NOTE: no explicit `agentAddress udp:161` line here. Net-SNMP 5.9.4 (this image's
# alpine:3.19 base) double-binds when agentAddress is set to the SAME value as its
# compiled-in default port (161) — it opens the socket once for the configured
# agentAddress AND once more for its own implicit default, then fails the second
# bind with EADDRINUSE and exits (confirmed via strace during 139-08 live
# validation). Omitting the line lets Net-SNMP fall back to its single implicit
# default bind on udp:161, which works correctly. Non-default ports (e.g. 162,
# 200) are unaffected — only an explicit agentAddress matching the default triggers
# the double bind.

# Read-only community string — allow queries from any source (v2c fallback path)
rocommunity public default

# SNMPv3 USM user — SHA-auth + AES-priv (Phase 139 SNMPV3-01/D-02).
# Lab-only, non-secret passphrases (T-139-07-01) — same posture as the
# `rocommunity public` string above. createUser lines are processed by
# Net-SNMP at daemon startup; net-snmp persists derived keys internally.
createUser quirkv3user SHA "quirklabauthpass1" AES "quirklabprivpass1"
rouser quirkv3user priv

# System identity OIDs
sysDescr "Cisco IOS Software, Version 15.2(4)M3, RELEASE SOFTWARE (fc2)"
sysName "cisco-sim-hwcompat"
sysObjectID 1.3.6.1.4.1.9.1.1

# Disable access logging for lab cleanliness
dontLogTCPWrappersConnects yes
