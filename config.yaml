# quirk-lab-config: true
#
# This file is the repo's chaos-lab working config -- it is NOT the shipped
# default. `quirk/config_template.yaml` is the shipped default; `quirk init`
# copies that file verbatim with no branching (Phase 184.2 D-13). Any
# connector divergence from the template below must be listed in this
# file's own exception list with a reason, or
# tests/test_config_connector_drift.py's D-13 gate fails.
#
# lab-only connector exceptions:
#   enable_kerberos: armed true against the chaos lab's kerberos profile (samba-dc KDC on 127.0.0.1:88/389, Phase 89 LAB-06); the shipped template ships this false pending a quirk[identity] install
#   kerberos_targets: points at the chaos lab kerberos profile's samba-dc KDC on 127.0.0.1 (Phase 89 LAB-06)
#   saml_targets: points at the chaos lab saml profile's simplesamlphp IdP metadata endpoint on localhost:8080 (Phase 89 LAB-06)
#   dnssec_targets: points at the chaos lab dnssec profile's weak.example.com / unsigned.example.com fixtures (Phase 89 LAB-06)
#   dnssec_resolver: routes DNSSEC queries to the chaos lab dnssec profile's bind9 resolver on 127.0.0.1:15353 (Phase 89 LAB-06)

# vertical: healthcare

assessment:
  name: "Quantum Crypto Readiness - CLIENT NAME"
  data_classification: "confidential"   # public|internal|confidential|regulated
  report_owner: "CLIENT NAME"
  timezone: "America/New_York"

scan:
  timeout_seconds: 5
  concurrency: 200
  ports_tls: [443,8443,9443,10443,11443,12443,8444,8000,2222,5555]
  include_sni: true

  tls_enum_mode: fast  # off|fast|deep

  fingerprint_timeout_seconds: 2
  fingerprint_concurrency: 200

  tls_timeout_seconds: 5
  tls_concurrency: 150

  ssh_timeout_seconds: 5
  ssh_concurrency: 100

targets:
  fqdns:
  cidrs: [127.0.0.1]
  include_ips: []
  exclude_ips: []

connectors:
  enable_aws: false
  enable_azure: false
  # -- Identity connectors (Phase 89 LAB-06 / D-04) --
  # Kerberos KDC: samba-dc on the chaos lab kerberos profile (port 88/389)
  enable_kerberos: true
  kerberos_targets:
    - "127.0.0.1"
  # SAML IdP: simplesamlphp on the chaos lab saml profile (port 8080)
  enable_saml: true
  saml_targets:
    - "http://localhost:8080/simplesaml/saml2/idp/metadata.php"
  # DNSSEC: bind9-dnssec on the chaos lab dnssec profile (port 15353)
  enable_dnssec: true
  dnssec_targets:
    - "weak.example.com"
    - "unsigned.example.com"
  # Route DNSSEC queries to the lab's bind9 resolver on port 15353
  # (dnssec_scanner.py port-override support added Phase 89 LAB-06)
  dnssec_resolver: "127.0.0.1:15353"

output:
  directory: "output"
  db_path: "quirk-output/quirk.db"   # canonical — matches dashboard/doctor/console resolution (Phase 74 D-05)

intelligence:
  intelligence_version: "3.9.0"
  profile: "balanced"        # lenient|balanced|strict
  calibration_overrides: {}

# Phase 121: Server-policy flag for internal target scanning.
# Set to false on machines that also scan untrusted client environments.
security:
  allow_internal_targets: true

# Console behavior settings (Phase 114 AUTOMERGE-02)
console:
  auto_merge:
    enabled: true                        # default: ON (D-07); set false to require manual `quirk sensor merge`
    trigger_condition: all-sensors-in    # "all-sensors-in" | "cadence-window" (D-08)
    # cadence_window_minutes: 1440       # used only when trigger_condition: cadence-window
    #                                    # defaults to per-sensor expected_cadence_minutes (D-09)
