name: Dashboard Quality

on:
  pull_request:
    paths:
      - 'src/dashboard/**'
      - 'quirk/dashboard/**'
      - 'scripts/check-bundle-freshness.sh'
      - '.github/workflows/dashboard-quality.yml'
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  a11y:
    name: Axe + Console Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/dashboard
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: src/dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build dashboard
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Install Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce  # v1.7.3
        with:
          # Phase 185 D-07 -- pinned from run 34066331311 (2026-09-06); supersedes 165-CONTEXT.md D-04's unpinned-Chrome residual risk. D-06 keeps exact counts with no jitter tolerance, so the pin replaces that mitigation.
          chrome-version: '152.0.7977.82'

      - name: Run axe + console sweep (happy fixture)
        run: npm run a11y:check
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}

      - name: Run axe + console sweep (empty fixture)
        run: npm run a11y:check:empty
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}

      - name: Run axe + console sweep (loading fixture)
        run: npm run a11y:check:loading
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}

  a11y-regenerate-baselines:
    name: Regenerate a11y Baselines (Linux, manual)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: src/dashboard
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: src/dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build dashboard
        run: npm run build

      - name: Install Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce  # v1.7.3
        with:
          # Phase 185 D-07 -- pinned from run 34066331311 (2026-09-06); supersedes 165-CONTEXT.md D-04's unpinned-Chrome residual risk. D-06 keeps exact counts with no jitter tolerance, so the pin replaces that mitigation.
          chrome-version: '152.0.7977.82'

      - name: Record resolved Chrome version
        run: '"${{ steps.setup-chrome.outputs.chrome-path }}" --version'

      - name: Regenerate baselines (default fixture)
        run: npm run a11y:baseline
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}

      - name: Regenerate baselines (empty fixture)
        run: npm run a11y:baseline:empty
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}

      - name: Regenerate baselines (loading fixture)
        run: npm run a11y:baseline:loading
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}

      - name: Upload regenerated baselines
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: a11y-baselines-${{ github.run_id }}
          path: |
            src/dashboard/tests/a11y/baseline-*.json
            src/dashboard/tests/a11y/ACCEPTED-VIOLATIONS.md
          if-no-files-found: error

  e2e-smoke:
    name: E2E Smoke (real server + committed bundle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Setup Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: src/dashboard/package-lock.json

      - name: Install nmap (required for top1000 port scope in E2E scan)
        run: sudo apt-get install -y nmap

      - name: Install project (editable, dashboard extra)
        run: pip install -e ".[dashboard]"

      - name: Install dependencies
        run: npm ci
        working-directory: src/dashboard

      - name: Run frontend unit tests
        run: npm test
        working-directory: src/dashboard

      - name: Install Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce  # v1.7.3
        with:
          # Phase 185 D-07 -- pinned from run 34066331311 (2026-09-06); supersedes 165-CONTEXT.md D-04's unpinned-Chrome residual risk. D-06 keeps exact counts with no jitter tolerance, so the pin replaces that mitigation.
          chrome-version: '152.0.7977.82'

      - name: Run E2E smoke (route walk + scan lifecycle)
        run: npm run e2e:smoke
        working-directory: src/dashboard
        env:
          E2E_PYTHON: python
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}

  bundle-freshness:
    name: Bundle Freshness Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: src/dashboard/package-lock.json

      - name: Rebuild and diff committed bundle
        run: bash scripts/check-bundle-freshness.sh
