# Release workflow — tag-triggered PyPI publish with Sigstore attestations
#
# Closes:
#   - RELENG-02: GitHub Actions Trusted Publishers (OIDC, no stored API tokens)
#   - RELENG-03: Sigstore attestations auto-generated via pypa/gh-action-pypi-publish
#
# Trigger: push of a release-like tag matching `v[0-9]*` (e.g. `v5.0.0`, `v5.15`) — OR a manual
# `workflow_dispatch` dry-run from the Actions tab (RELEASE-02). A dispatch run publishes
# nothing: the PyPI `publish` job and the "Attach zip to GitHub Release" step are both gated
# on `github.event_name == 'push'` (not merely on a `refs/tags/` ref shape), so dispatching
# against a tag ref is still a no-publish dry run — see the RELEASE_GUARD comments below.
#
# Prerequisite (one-time, manual setup — performed AFTER this file lands on main
# and the first `v*.*.*` tag is pushed):
#   1. Configure a Trusted Publisher at PyPI:
#        https://pypi.org/manage/account/publishing/
#      with:
#        - PyPI project name: `quirk-scanner` (per v4.10-D-02 in plan 84-01)
#        - Repo owner/name:  this repository
#        - Workflow filename: `release.yml`
#        - Environment name:  `release`
#   2. Create a GitHub environment named `release` in repo Settings -> Environments
#      (no protection rules required initially; tag-pattern restriction `v*` can
#      be added later).
#
# The step-by-step runbook lives in `docs/release-process.md` (plan 84-04).
#
# Downstream verification of Sigstore attestations (consumers):
#   gh attestation verify <wheel-or-sdist> --repo <owner>/<repo>
# or via cosign:
#   cosign verify-blob --bundle <attestation.sigstore.json> <artifact>
#
# Security note: this workflow takes no untrusted user input. The only event is
# `push.tags` with a `v[0-9]*` filter; no issue/PR/comment bodies are
# interpolated into run: steps.
#
# RVW-004/RVW-016 — why the filter is deliberately loose:
# It used to be the strict `v*.*.*`, which silently matched NOTHING for a
# two-component tag. Pushing `v5.9`, `v5.13` and `v5.14` therefore fired no
# workflow at all — three milestones declared shipped that never reached PyPI,
# with zero Actions events to notice. A trigger that no-ops on a typo is a trap;
# `v[0-9]*` matches whatever the tag hygiene guard
# (scripts/release_tag_hygiene.py) considers release-like, so the two can no
# longer disagree about what counts as a release tag. Convention is still
# 3-component semver — but a mistake now produces a visible release run rather
# than silence.

name: Release

on:
  push:
    tags:
      - 'v[0-9]*'   # RVW-004: loose on purpose — see the security note above
  workflow_dispatch:

# Workflow-level least-privilege default (WR-04). Each job that needs broader
# scope declares its own permissions: block below; this default prevents the
# GITHUB_TOKEN from silently receiving write-all on unscoped jobs.
permissions:
  contents: read

# Opt all jobs into Node.js 24 now (actions/download-artifact@v4.3.0 still
# declares node20; forced upgrade to node24 is mandatory from 2026-06-16).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    name: Build wheel + sdist
    runs-on: ubuntu-latest
    permissions:
      contents: read  # checkout only — no release or package write needed (WR-04)
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.11'

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Build distributions
        run: python -m build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI (Trusted Publishers + Sigstore)
    needs: build
    # Deliberately tests the triggering EVENT, not just the ref shape: a workflow_dispatch
    # run can target a tag ref (`gh workflow run release.yml --ref v5.11.0`), which would make
    # a ref-only guard evaluate TRUE and really publish to PyPI on a "dry run". Do not simplify
    # this to `startsWith(github.ref, 'refs/tags/')` alone (RELEASE-02, D-06).
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/p/quirk-scanner
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # v1.14.0
        with:
          attestations: true

  windows-package:
    name: Build Windows zip + attach GitHub Release asset
    runs-on: windows-latest
    permissions:
      contents: write  # Required to create/update GitHub Release assets (T-118-REL-PERM)
    # NOTE: This job does NOT use id-token or PyPI scopes — it only accesses the
    # GitHub Release via GITHUB_TOKEN (T-118-NS). PyPI publish is handled by the
    # separate 'publish' job above.
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.11'

      - name: Install project and PyInstaller
        shell: pwsh
        run: |
          pip install -e .
          if ($LASTEXITCODE -ne 0) { Write-Error "pip install -e . failed (exit $LASTEXITCODE)"; exit 1 }
          pip install pyinstaller==6.20.0
          if ($LASTEXITCODE -ne 0) { Write-Error "pip install pyinstaller failed (exit $LASTEXITCODE)"; exit 1 }

      - name: Build onedir EXE
        shell: pwsh
        run: |
          # Exact Phase 117 flag set proven on windows-latest runner (T-118-SC: PyInstaller pinned above)
          pyinstaller --onedir --name quirk `
            --collect-all quirk `
            --collect-all sqlalchemy `
            --collect-all fastapi `
            --collect-all cyclonedx `
            --collect-all jsonschema `
            --collect-all jsonschema_specifications `
            --collect-all rfc3987_syntax `
            --collect-all lark `
            --copy-metadata quirk-scanner `
            --hidden-import sqlalchemy.dialects.sqlite `
            --hidden-import sqlalchemy.dialects.sqlite.pysqlite `
            --hidden-import uvicorn.logging `
            --hidden-import uvicorn.loops.auto `
            --hidden-import uvicorn.protocols.http.auto `
            --add-data "quirk/compliance/cmvp_cache.json;quirk/compliance" `
            --add-data "quirk/compliance/cmvp_curated.csv;quirk/compliance" `
            --add-data "quirk/reports/templates;quirk/reports/templates" `
            run_scan.py
          if ($LASTEXITCODE -ne 0) { Write-Error "PyInstaller build failed (exit $LASTEXITCODE)"; exit 1 }

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $v = python -c "from quirk import __version__; print(__version__)"
          if ($LASTEXITCODE -ne 0 -or -not $v) {
            Write-Error "Failed to read version (LASTEXITCODE=$LASTEXITCODE, value='$v')"; exit 1
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$v"
          Write-Output "Read version: $v"

      - name: Determine signing capability
        id: signcap
        shell: pwsh
        run: |
          $has = "${{ secrets.QUIRK_SIGNING_CERT_BASE64 }}" -ne "" -and "${{ secrets.QUIRK_SIGNING_CERT_PASSWORD }}" -ne ""
          Add-Content -Path $env:GITHUB_OUTPUT -Value "has_prod_cert=$has"

      - name: Sign with production certificate (if configured)
        # Signs the standalone onedir exe BEFORE it is staged/zipped (dist\quirk\quirk.exe,
        # not quirk-windows-staging\quirk\quirk.exe — the staging dir does not exist yet at
        # this point in the job). No-ops cleanly when signing secrets are absent (D-08).
        if: steps.signcap.outputs.has_prod_cert == 'true'
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String("${{ secrets.QUIRK_SIGNING_CERT_BASE64 }}")
          [IO.File]::WriteAllBytes("prod_signing_cert.pfx", $bytes)
          $signtool = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
                       Sort-Object VersionInfo.FileVersion -Descending | Select-Object -First 1).FullName
          & $signtool sign /f prod_signing_cert.pfx /p "${{ secrets.QUIRK_SIGNING_CERT_PASSWORD }}" `
            /fd sha256 /tr http://timestamp.digicert.com /td sha256 `
            "dist\quirk\quirk.exe"
          if ($LASTEXITCODE -ne 0) { Write-Error "signtool sign failed (exit $LASTEXITCODE)"; exit 1 }
          & $signtool verify /pa /v "dist\quirk\quirk.exe"
          if ($LASTEXITCODE -ne 0) { Write-Error "signtool verify failed (exit $LASTEXITCODE)"; exit 1 }

      - name: Clean up production signing artifacts
        if: always()
        shell: pwsh
        run: |
          if (Test-Path "prod_signing_cert.pfx") { Remove-Item "prod_signing_cert.pfx" -Force }

      - name: CI self-test — ephemeral cert signing round-trip
        # Proves the signtool/decode/cleanup wiring end-to-end without any real secret (D-10).
        # Signs a THROWAWAY copy of the exe, never dist\quirk\quirk.exe itself, so no
        # self-signed signature ever lands on the shipped binary (T-143-SELFSIGN).
        shell: pwsh
        run: |
          $testCert = New-SelfSignedCertificate -Subject "CN=QUIRK CI Self-Test" `
            -Type CodeSigningCert -KeyUsage DigitalSignature `
            -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddDays(1)
          $testPw = ConvertTo-SecureString -String "ci-selftest-only" -Force -AsPlainText
          Export-PfxCertificate -Cert $testCert -FilePath "selftest_cert.pfx" -Password $testPw | Out-Null

          $signtool = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
                       Sort-Object VersionInfo.FileVersion -Descending | Select-Object -First 1).FullName
          Copy-Item "dist\quirk\quirk.exe" "selftest_target.exe"
          & $signtool sign /f selftest_cert.pfx /p "ci-selftest-only" /fd sha256 "selftest_target.exe"
          if ($LASTEXITCODE -ne 0) { Write-Error "Self-test signing failed (exit $LASTEXITCODE)"; exit 1 }

          # `signtool verify /pa` applies the Authenticode policy, which requires the chain to
          # terminate in a TRUSTED root. A self-signed cert sitting only in CurrentUser\My can
          # never satisfy that, so the verify below failed 100% of the time (first observed on
          # the v5.11.0 tag — the first release run since this step was added in Phase 143, as
          # v5.10.0 was never pushed and `v5.9` did not match this workflow's `v*.*.*` glob).
          # Trust the ephemeral root for the life of the job; the cleanup step below removes it.
          Export-Certificate -Cert $testCert -FilePath "selftest_root.cer" | Out-Null
          Import-Certificate -FilePath "selftest_root.cer" `
            -CertStoreLocation Cert:\LocalMachine\Root | Out-Null

          & $signtool verify /pa /v "selftest_target.exe"
          if ($LASTEXITCODE -ne 0) { Write-Error "Self-test signature verification failed"; exit 1 }
          Write-Output "SELF_TEST_SIGNING: OK — signtool wiring verified end-to-end"

      - name: Clean up self-test artifacts
        if: always()
        shell: pwsh
        run: |
          Remove-Item "selftest_cert.pfx" -Force -ErrorAction SilentlyContinue
          Remove-Item "selftest_target.exe" -Force -ErrorAction SilentlyContinue
          Remove-Item "selftest_root.cer" -Force -ErrorAction SilentlyContinue
          Get-ChildItem Cert:\CurrentUser\My | Where-Object { $_.Subject -eq "CN=QUIRK CI Self-Test" } |
            Remove-Item -Force -ErrorAction SilentlyContinue
          # Also drop the ephemeral root trusted for the verify step above, so no self-signed
          # code-signing root outlives this job even if the runner image were ever reused.
          Get-ChildItem Cert:\LocalMachine\Root | Where-Object { $_.Subject -eq "CN=QUIRK CI Self-Test" } |
            Remove-Item -Force -ErrorAction SilentlyContinue

      - name: Assemble Windows operator zip
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          Write-Output "Assembling quirk-windows-$version.zip ..."

          # Staging layout mirrors the 118-01 zip assembly:
          #   staging\
          #     quirk\            <- onedir bundle (quirk.exe + _internal\)
          #     install.ps1
          #     uninstall.ps1
          #     sensor.sample.yaml
          $staging = "quirk-windows-staging"
          if (Test-Path $staging) { Remove-Item $staging -Recurse -Force }
          New-Item -ItemType Directory -Path $staging | Out-Null

          Copy-Item -Path "dist\quirk" -Destination "$staging\quirk" -Recurse
          Copy-Item "packaging\windows\install.ps1"        "$staging\"
          Copy-Item "packaging\windows\uninstall.ps1"      "$staging\"
          Copy-Item "packaging\windows\sensor.sample.yaml" "$staging\"

          $zipName = "quirk-windows-$version.zip"
          try {
            Compress-Archive -Path "$staging\*" -DestinationPath $zipName -Force -ErrorAction Stop
          } catch {
            Write-Error "zip assembly failed: $_"; exit 1
          }
          if (-not (Test-Path $zipName)) {
            Write-Error "Compress-Archive reported success but '$zipName' was not found on disk."; exit 1
          }

          $mb = [math]::Round((Get-Item $zipName).Length / 1MB, 1)
          Write-Output "ZIP_ASSEMBLED: $zipName ($mb MB)"

      - name: Upload dry-run zip artifact
        # Uploads the assembled zip as an inspectable workflow artifact on any run that is
        # NOT a real tag push, so a workflow_dispatch dry-run's output is inspectable without
        # creating any GitHub Release side-effect (RELEASE-02, D-07).
        if: ${{ !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: quirk-windows-dry-run
          path: quirk-windows-*.zip

      - name: Attach zip to GitHub Release
        # Deliberately tests the triggering EVENT, not just the ref shape — see the identical
        # comment on the `publish` job above (RELEASE-02, D-06). Byte-identical guard.
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        # T-118-SC: action pinned to commit SHA for supply-chain safety (WR-03).
        # SHA corresponds to softprops/action-gh-release v2.2.1.
        # Verify: https://github.com/softprops/action-gh-release/releases/tag/v2.2.1
        # Uses GITHUB_TOKEN only (T-118-NS, T-118-REL-PERM)
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda  # v2.2.1 (verified via GitHub API)
        with:
          files: quirk-windows-*.zip
          # Release notes documenting unsigned status + Authenticode deferral
          # T-118-SIGN: accepted risk; explicitly documented per v5.6 milestone decision
          body: |
            ## Windows Sensor Asset

            ### UNSIGNED BINARY NOTICE

            The `quirk-windows-*.zip` asset contains a Windows onedir bundle (`quirk.exe`)
            that is **NOT Authenticode-signed**.

            - **SmartScreen warning:** Windows may display a "Windows protected your PC"
              prompt when running `install.ps1` or `quirk.exe` for the first time.
              Click "More info" and then "Run anyway" to proceed.
            - **Authenticode signing is DEFERRED** to a future milestone spike.
              The binary is built reproducibly from source via this GitHub Actions
              workflow — operators who require signed binaries should build from source
              until Authenticode signing is implemented.

            ### Quick install (PowerShell, no admin required)

            ```powershell
            # 1. Download and unpack the zip
            Expand-Archive -Path quirk-windows-<version>.zip -DestinationPath C:\quirk-install

            # 2. Install — registers per-user Scheduled Task
            cd C:\quirk-install
            pwsh -File install.ps1 `
              -ConsoleUrl https://<console-host>:8512 `
              -EnrollmentToken <per-sensor-token>
            ```

            See the Windows sensor deployment section in the Operators Guide
            (docs/operators-guide.md §8.8) for full install / Scheduled Task /
            uninstall documentation.
          token: ${{ secrets.GITHUB_TOKEN }}
