assessment:
  name: "Scorecard Sample Run"
  data_classification: "internal"
  report_owner: "Security Team"
  timezone: "America/New_York"

scan:
  timeout_seconds: 1
  concurrency: 20
  # TRIAGE-05 / BACK-59 (Phase 189, decided 2026-09-08): port 22 is KEPT here
  # deliberately, to demonstrate the `NOT_TLS_ON_PORT` classification
  # (`quirk/scanner/tls_scanner.py::_categorize_tls_error`) firing against a
  # real SSH listener -- a TLS ClientHello against SSH answers with
  # WRONG_VERSION_NUMBER, and QU.I.R.K. surfaces that as a usable endpoint
  # signal (`tls_blocker_reason`/`scan_error`), not a swallowed exception.
  # Mechanism re-checked 2026-10-12 against a local listener that sends an
  # SSH banner, and covered by tests/test_tls_error_categorization.py.
  # Port 22 is intentionally NOT part of the shipped
  # `CONSULTING_TLS_PORTS` default (`quirk/interactive.py`) -- this sample
  # is meant to be illustrative, not a scan-scope precedent to copy blindly.
  ports_tls: [22, 443, 8443]
  tls_designated_ports: []
  include_sni: false
  tls_enum_mode: fast
  fingerprint_timeout_seconds: 1
  fingerprint_concurrency: 20
  tls_timeout_seconds: 1
  tls_concurrency: 10
  ssh_timeout_seconds: 1
  ssh_concurrency: 10

targets:
  fqdns: []
  cidrs: []
  include_ips: ["127.0.0.1"]
  exclude_ips: []

connectors:
  enable_aws: false  # off: requires-credentials - AWS_ACCESS_KEY_ID / IAM profile not configured
  enable_azure: false  # off: requires-credentials - Azure subscription / auth not configured
  enable_adcs: false  # off: requires-extra-install - requires the quirk-scanner[adcs] extras group (ldap3); [all] includes it
  # adcs_targets:
  #   - ldap://dc.example.com

output:
  directory: "tmp/sample_output"
  db_path: "tmp/sample_output/sample.sqlite"

# Report Branding & Templates — Phase 200 (5.25.0+)
# Every key below is optional and defaults to unset. report.branding.logo_path
# is preferred over the legacy assessment.logo_path fallback.
# report:
#   branding:
#     logo_path: /path/to/your-org-logo.png
#     client_name: "Acme Corp"
#     engagement_name: "Q3 2026 Crypto Assessment"
